notifications:
  get:
    tags: [Notifications]
    summary: List the current user's notifications
    description: |
      Notifications are created by the system (a new comment, a new follower). There is no
      HTTP endpoint for creating them.
    operationId: listNotifications
    security:
    - bearerAuth: []
    parameters:
    - name: unread
      in: query
      description: Send `true` to return unread notifications only.
      schema: {type: boolean}
    - name: limit
      in: query
      schema: {type: integer, default: 20, minimum: 1, maximum: 100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: Notifications with pagination meta.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/PaginatedEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/notification.yaml#/NotificationResponse}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
notificationsUnreadCount:
  get:
    tags: [Notifications]
    summary: Number of unread notifications
    operationId: getUnreadNotificationCount
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Unread count.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count: {type: integer, format: int64}
            example:
              success: true
              message: Unread count fetched successfully
              data: {unread_count: 3}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
notificationsReadAll:
  patch:
    tags: [Notifications]
    summary: Mark every notification as read
    operationId: markAllNotificationsRead
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Number of rows updated.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated_count: {type: integer, format: int64}
            example:
              success: true
              message: All notifications marked as read
              data: {updated_count: 5}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
notificationsByIdRead:
  patch:
    tags: [Notifications]
    summary: Mark one notification as read
    operationId: markNotificationRead
    security:
    - bearerAuth: []
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    responses:
      '200':
        description: The notification, with `read` set to `true`.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/notification.yaml#/NotificationResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
