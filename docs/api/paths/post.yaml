              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/post.yaml#/SitemapPost}
      '500': {$ref: ../responses.yaml#/ServerError}
postsUsernameByUsername:
  get:
    tags: [Posts]
    summary: Published posts by author username
    operationId: getPostsByUsername
    security: []
    parameters:
    - name: username
      in: path
      required: true
      schema: {type: string}
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
