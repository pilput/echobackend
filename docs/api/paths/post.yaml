postsByIdComments:
  parameters:
  - {$ref: ../parameters.yaml#/PostIdPath}
  get:
    tags: [Comments]
    summary: Comments on a post
    operationId: getComments
    security: []
    responses:
      '200':
        description: Comments.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/post.yaml#/CommentResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '500': {$ref: ../responses.yaml#/ServerError}
  post:
    tags: [Comments]
    summary: Add a comment
    operationId: createComment
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/post.yaml#/CommentRequest}
    responses:
      '201':
        description: Comment created.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/CommentEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdCommentsByCommentId:
  parameters:
  - {$ref: ../parameters.yaml#/PostIdPath}
  - name: comment_id
    in: path
    required: true
    schema: {type: string, format: uuid}
  put:
    tags: [Comments]
    summary: Edit a comment (owner only)
    description: There is no admin override for editing.
    operationId: updateComment
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/post.yaml#/CommentRequest}
    responses:
      '200':
        description: Updated comment.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/CommentEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Comments]
    summary: Delete a comment (owner or super admin)
    description: A super admin may delete any user's comment, for moderation.
    operationId: deleteComment
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Comment deleted.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdView:
  post:
    tags: [Post views]
    summary: Record a view for the current user
    operationId: recordPostView
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    responses:
      '200':
        description: View recorded.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdViews:
  get:
    tags: [Post views]
    summary: List raw view records for a post
    operationId: getPostViews
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: Views with pagination meta.
        content:
          application/json:
            schema:
              allOf:
