    security: []
    parameters:
    - name: tag
      in: path
      required: true
      description: Tag name.
      schema: {type: string}
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: Posts with pagination meta.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostListEnvelope}
      '500': {$ref: ../responses.yaml#/ServerError}
postsById:
  parameters:
  - {$ref: ../parameters.yaml#/PostIdPath}
  get:
    tags: [Posts]
    summary: One post by ID (admin)
    operationId: getPostById
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Post.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
  put:
    tags: [Posts]
    summary: Update any post (admin)
    operationId: updatePost
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/post.yaml#/UpdatePostRequest}
    responses:
      '200':
        description: Updated post.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Posts]
    summary: Delete any post (admin)
    operationId: deletePost
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Post deleted.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
