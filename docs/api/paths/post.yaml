      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdLike:
  parameters:
  - {$ref: ../parameters.yaml#/PostIdPath}
  post:
    tags: [Post likes]
    summary: Like a post
    operationId: likePost
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Post liked.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400':
        description: Invalid post ID, or the post is already liked.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/ErrorEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Post likes]
    summary: Remove a like
    operationId: unlikePost
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Like removed.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400':
        description: Invalid post ID, or the post was not liked.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/ErrorEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdLikes:
  get:
    tags: [Post likes]
    summary: Users who liked a post
    description: |
      Pagination values are returned inside `data`, not in the `meta` envelope field.
    operationId: getPostLikes
    security: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: Likes.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      likes:
                        type: array
                        items: {$ref: ../schemas/post.yaml#/PostLikeResponse}
                      total: {type: integer, format: int64}
                      limit: {type: integer}
                      offset: {type: integer}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdLikeStats:
  get:
    tags: [Post likes]
    summary: Like statistics for a post
    operationId: getPostLikeStats
    security: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    responses:
      '200':
        description: Statistics.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/post.yaml#/PostLikeStats}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdLiked:
  get:
    tags: [Post likes]
    summary: Whether the current user has liked the post
    operationId: checkUserLiked
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    responses:
      '200':
        description: Like status.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      has_liked: {type: boolean}
                      post_id: {type: string, format: uuid}
                      user_id: {type: string, format: uuid}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
