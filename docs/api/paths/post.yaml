                properties:
                  data: {$ref: ../schemas/post.yaml#/PostViewStats}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '500': {$ref: ../responses.yaml#/ServerError}
postsByIdViewed:
  get:
    tags: [Post views]
    summary: Whether the current user has viewed the post
    operationId: checkUserViewed
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/PostIdPath}
    responses:
      '200':
        description: View status.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      has_viewed: {type: boolean}
