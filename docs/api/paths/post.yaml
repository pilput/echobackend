            schema: {$ref: ../schemas/post.yaml#/PostListEnvelope}
      '500': {$ref: ../responses.yaml#/ServerError}
postsUByUsernameBySlug:
  get:
    tags: [Posts]
    summary: One post by author username and slug
    description: Full detail — the body is not truncated.
    operationId: getPostBySlugAndUsername
    security: []
    parameters:
    - name: username
      in: path
      required: true
      schema: {type: string}
    - name: slug
      in: path
      required: true
      schema: {type: string}
    responses:
      '200':
        description: Post.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostEnvelope}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
postsTagByTag:
  get:
    tags: [Posts]
    summary: Published posts carrying a tag
