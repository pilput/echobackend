posts:
  get:
    tags: [Posts]
    summary: List posts
    description: |
      `body` is truncated to about 250 runes plus `" ..."` in list responses.

      This is the one endpoint whose `limit` is not capped at 100.
    operationId: listPosts
    security: []
    parameters:
    - name: limit
      in: query
      schema: {type: integer, default: 10, minimum: 1}
    - {$ref: ../parameters.yaml#/Offset}
    - name: search
      in: query
      schema: {type: string}
    - name: sort_by
      in: query
      schema:
        type: string
        enum: [id, title, created_at, updated_at, view_count, like_count]
        default: created_at
    - name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    - name: start_date
      in: query
      schema: {type: string, format: date}
    - name: end_date
      in: query
      schema: {type: string, format: date}
    - name: published
      in: query
      schema: {type: boolean}
    - name: created_by
      in: query
      description: Author UUID.
      schema: {type: string, format: uuid}
    - name: tags
      in: query
      description: Comma-separated tag names.
      schema: {type: string}
      example: golang,postgres
    responses:
      '200':
        description: Posts with pagination meta.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostListEnvelope}
      '500': {$ref: ../responses.yaml#/ServerError}
  post:
    tags: [Posts]
    summary: Create a post
    operationId: createPost
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/post.yaml#/CreatePostRequest}
    responses:
      '201':
        description: Post created; only the new ID is returned.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: string, format: uuid}
            example:
              success: true
              message: Successfully created post
              data: {id: 0195f3c0-0000-7000-8000-000000000000}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
postsRandom:
  get:
    tags: [Posts]
    summary: Random published posts
    operationId: getRandomPosts
    security: []
    parameters:
    - name: limit
      in: query
      schema: {type: integer, default: 9, minimum: 1, maximum: 20}
    responses:
      '200':
        description: Posts.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/post.yaml#/PostResponse}
      '500': {$ref: ../responses.yaml#/ServerError}
postsTrending:
  get:
    tags: [Posts]
    summary: Trending posts
    operationId: getTrendingPosts
    security: []
    parameters:
    - name: limit
      in: query
      schema: {type: integer, default: 10, minimum: 1, maximum: 100}
    responses:
      '200':
        description: Posts.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/post.yaml#/PostResponse}
      '500': {$ref: ../responses.yaml#/ServerError}
postsMe:
  get:
    tags: [Posts]
    summary: Posts owned by the current user, including drafts
    operationId: getMyPosts
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    - name: search
      in: query
      description: Case-insensitive match against `posts.title` (`ILIKE '%search%'`).
      schema: {type: string}
    - name: published
      in: query
      description: |
        Omit (or send anything other than `true`/`false`) to include both published and
        draft posts.
      schema: {type: boolean}
    responses:
      '200':
        description: Posts with pagination meta.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostListEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsMeAnalytics:
  get:
    tags: [Posts]
    summary: Aggregated analytics for the current user's posts
    description: |
      `view_trend` has one point per day in the range, including days with zero views.
      `top_posts` holds up to 5 posts with the highest `view_count`.
    operationId: getMyPostsAnalytics
    security:
    - bearerAuth: []
    parameters:
    - name: start_date
      in: query
      description: Defaults to 30 days ago.
      schema: {type: string, format: date}
    - name: end_date
      in: query
      description: Defaults to today.
      schema: {type: string, format: date}
    responses:
      '200':
        description: Analytics.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/post.yaml#/MyPostsAnalyticsResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsMeAnalyticsLikesByMonth:
  get:
    tags: [Posts]
    summary: Likes received per month by the current user's posts
    description: |
      `series` has one point per month (`YYYY-MM`), zero-filled for months without likes.
    operationId: getMyPostsLikesByMonth
    security:
    - bearerAuth: []
    parameters:
    - name: months
      in: query
      description: Last N calendar months, including the current one.
      schema: {type: integer, default: 12, minimum: 1, maximum: 24}
    responses:
      '200':
        description: Monthly like series.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/post.yaml#/MyPostsLikesByMonthResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsMeById:
  parameters:
  - {$ref: ../parameters.yaml#/PostIdPath}
  get:
    tags: [Posts]
    summary: Read one of the current user's own posts
    operationId: getMyPost
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Post.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
  put:
    tags: [Posts]
    summary: Update one of the current user's own posts
    operationId: updateMyPost
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/post.yaml#/UpdatePostRequest}
    responses:
      '200':
        description: Updated post.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Posts]
    summary: Delete one of the current user's own posts
    description: Posts are hard-deleted since migration 014.
    operationId: deleteMyPost
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Post deleted.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
postsFeedForYou:
  get:
    tags: [Posts]
    summary: Personalised feed for the current user
    operationId: getPostsForYou
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: Posts with pagination meta.
        content:
          application/json:
            schema: {$ref: ../schemas/post.yaml#/PostListEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
postsImage:
  post:
    tags: [Posts]
    summary: Upload a post image
    description: |
      This route has its own 1 MiB body limit, tighter than the global 10 MB.
      `path` and `url` currently hold the same stored object key.
    operationId: uploadPostImage
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [image]
            properties:
              image: {type: string, format: binary, description: 'Max 1 MiB (1,048,576 bytes).'}
    responses:
      '201':
        description: Image stored.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      path: {type: string}
                      url: {type: string}
            example:
              success: true
              message: Successfully uploaded image
              data: {path: posts/0195f3c0.png, url: posts/0195f3c0.png}
      '400':
        description: Empty file, or storage unavailable.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/ErrorEnvelope}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '413': {description: File larger than 1 MiB.}
      '500': {$ref: ../responses.yaml#/ServerError}
postsSitemap:
  get:
    tags: [Posts]
    summary: Posts formatted for sitemap generation
    operationId: getPostsForSitemap
    security: []
    parameters:
    - name: limit
      in: query
      schema: {type: integer, default: 50000, minimum: 1, maximum: 50000}
    responses:
      '200':
        description: Sitemap entries.
        content:
