chatConversations:
  get:
    tags: [Chat]
    summary: List the current user's conversations
    operationId: listConversations
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/Limit100}
    - {$ref: ../parameters.yaml#/Offset}
    responses:
      '200':
        description: |
          Conversations with pagination meta, newest `updated_at` first. `data` is always an
          array (`[]` when there are none). `chat_messages` is not included.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/PaginatedEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/chat.yaml#/ChatConversationResponse}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '500': {$ref: ../responses.yaml#/ServerError}
  post:
    tags: [Chat]
    summary: Create an empty conversation
    operationId: createConversation
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/chat.yaml#/CreateChatConversationRequest}
    responses:
      '201':
        description: Conversation created.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/chat.yaml#/ChatConversationResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
chatConversationsStream:
  post:
    tags: [Chat]
    summary: Create a conversation with a first message, streaming the AI reply
    description: |
      When streaming is available the response is `text/event-stream`; each event carries
      a JSON payload `{ "type": ..., "data": ... }`, in this order:

      | `type` | `data` |
      |--------|--------|
      | `conversation_created` | `{ conversation_id, user_message }` |
      | `ai_chunk` | text chunk |
      | `ai_complete` | the AI `ChatMessageResponse` |
      | `error` | error message |

      After the first event come zero or more `ai_chunk` events, then exactly one of
      `ai_complete` or `error`. The stream always terminates with `data: [DONE]`, including
      after an `error` event. `error` data is the upstream provider's message, "OpenRouter
      returned an empty response", or "Failed to save AI response" when the reply could not
      be stored (internal error details are never sent).

      Streaming is unavailable when `OPENROUTER_API_KEY` is empty or no model resolves
      (neither `model` nor `OPENROUTER_DEFAULT_MODEL`). The endpoint then answers 201 with the
      normal envelope and `data` set to an array holding the user message; the created
      conversation is kept, and it is not auto-titled.
    operationId: createConversationStream
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/chat.yaml#/CreateChatConversationStreamRequest}
    responses:
      '200':
        description: Server-sent event stream.
        content:
          text/event-stream:
            schema: {type: string}
      '201':
        description: Streaming unavailable — the stored user message is returned.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/chat.yaml#/ChatMessageResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
chatConversationsById:
  parameters:
  - name: id
    in: path
    required: true
    description: Conversation UUID. A malformed value is rejected with 400 "Invalid conversation ID".
    schema: {type: string, format: uuid}
  get:
    tags: [Chat]
    summary: Conversation detail with all messages
    description: Only conversations owned by the token user are returned.
    operationId: getConversation
    security:
    - bearerAuth: []
    responses:
      '200':
        description: |
          Conversation including `chat_messages`, ordered by ascending `created_at` (`[]` when
          the conversation has no messages).
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/chat.yaml#/ChatConversationResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
  put:
    tags: [Chat]
    summary: Update a conversation's title or pin state
    description: A blank or whitespace-only `title` leaves the title unchanged.
    operationId: updateConversation
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/chat.yaml#/UpdateChatConversationRequest}
    responses:
      '200':
        description: Updated conversation.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data: {$ref: ../schemas/chat.yaml#/ChatConversationResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Chat]
    summary: Delete a conversation
    operationId: deleteConversation
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Conversation deleted.
        content:
          application/json:
            schema: {$ref: ../schemas/envelope.yaml#/EmptyEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
chatConversationsByConversationidMessages:
  parameters:
  - {$ref: ../parameters.yaml#/ConversationIdPath}
  get:
    tags: [Chat]
    summary: Messages in a conversation
    operationId: listMessages
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Messages.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/chat.yaml#/ChatMessageResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
  post:
    tags: [Chat]
    summary: Send a message
    description: |
      Stores the message and bumps the conversation's `updated_at`. When `role` is `user`
      and AI is available (`OPENROUTER_API_KEY` set and a model resolves), the AI reply is
      generated and stored too, and a "New conversation" is auto-titled from its first
      message; otherwise only the user message is returned. A malformed `conversationId`
      is rejected with 400 "Invalid conversation ID".
    operationId: createMessage
    security:
    - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/chat.yaml#/CreateChatMessageRequest}
    responses:
      '201':
        description: |
          The stored messages — the user message, plus the AI reply when one is available.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/chat.yaml#/ChatMessageResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
chatConversationsByConversationidMessagesStream:
  post:
    tags: [Chat]
    summary: Send a message and stream the AI reply
    description: |
      Same body as the non-streaming endpoint. When streaming is available the response is
      `text/event-stream` with these events:

      | `type` | `data` |
      |--------|--------|
      | `user_message` | the stored `ChatMessageResponse` |
      | `ai_chunk` | text chunk |
      | `ai_complete` | the AI `ChatMessageResponse` |
      | `error` | error message |

      After the first event come zero or more `ai_chunk` events, then exactly one of
      `ai_complete` or `error`. The stream always terminates with `data: [DONE]`, including
      after an `error` event. `error` data is the upstream provider's message, "OpenRouter
      returned an empty response", or "Failed to save AI response" when the reply could not
      be stored (internal error details are never sent).

      Streaming is unavailable when `OPENROUTER_API_KEY` is empty or no model resolves
      (neither `model` nor `OPENROUTER_DEFAULT_MODEL`), or when `role` is not
      `user`. The endpoint then answers 201 with the normal envelope and `data` set to an
      array holding the user message (no auto-title, no AI call).

      A malformed `conversationId` is rejected with 400 "Invalid conversation ID" before the
      body is validated.
    operationId: createMessageStream
    security:
    - bearerAuth: []
    parameters:
    - {$ref: ../parameters.yaml#/ConversationIdPath}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/chat.yaml#/CreateChatMessageRequest}
    responses:
      '200':
        description: Server-sent event stream.
        content:
          text/event-stream:
            schema: {type: string}
      '201':
        description: Streaming unavailable — the stored user message is returned.
        content:
          application/json:
            schema:
              allOf:
              - {$ref: ../schemas/envelope.yaml#/SuccessEnvelope}
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: ../schemas/chat.yaml#/ChatMessageResponse}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '422': {$ref: ../responses.yaml#/ValidationFailed}
      '500': {$ref: ../responses.yaml#/ServerError}
chatMessagesByMessageid:
  parameters:
  - name: messageId
    in: path
    required: true
    description: Message UUID. A malformed value is rejected with 400 "Invalid message ID".
    schema: {type: string, format: uuid}
  get:
    tags: [Chat]
    summary: One message
    description: |
      404 when the message is not the token user's, or when its conversation has been
      deleted; 403 when the conversation belongs to another user.
    operationId: getMessage
    security:
    - bearerAuth: []
    responses:
      '200':
        description: Message.
        content:
          application/json:
            schema: {$ref: ../schemas/chat.yaml#/ChatMessageEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
  delete:
    tags: [Chat]
    summary: Delete a message
    description: |
      Same lookup rules as GET. Hard-deletes the message and bumps the conversation's
      `updated_at`.
    operationId: deleteMessage
    security:
    - bearerAuth: []
    responses:
      '200':
        description: The deleted message is echoed back.
        content:
          application/json:
            schema: {$ref: ../schemas/chat.yaml#/ChatMessageEnvelope}
      '400': {$ref: ../responses.yaml#/BadRequest}
      '401': {$ref: ../responses.yaml#/Unauthorized}
      '403': {$ref: ../responses.yaml#/Forbidden}
      '404': {$ref: ../responses.yaml#/NotFound}
      '500': {$ref: ../responses.yaml#/ServerError}
