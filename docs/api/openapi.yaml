components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`.

        Tokens come from `POST /api/auth/login`, `POST /api/auth/refresh`, or
        `POST /api/auth/oauth/exchange`. Claims include `user_id` (UUID). The
        `is_super_admin` claim is a fast path only — the database is authoritative for
        admin checks.
