openapi: 3.1.0
info:
  title: echobackend API
  version: 1.0.0
  summary: HTTP API for the echobackend service.
  description: |
    HTTP API reference for frontend integration.

    All business routes live under the `/api` prefix; only `GET /` and `GET /health`
    sit outside it.

    ## Response envelope

    Almost every handler answers with the `pkg/response` envelope:

    ```json
    { "success": true, "message": "...", "data": {}, "meta": {} }
    ```

    `data`, `meta`, `error` and `errors` are `omitempty` — they disappear from the JSON
    when empty. Success responses carry no `error`/`errors`; error responses usually
    carry no `data`/`meta`.

    The two exceptions are `GET /health` (plain `{"status": ...}` object) and the chat
    streaming endpoints, which answer with `text/event-stream`.

    ## Pagination

    Paginated lists add a `meta` object (`total_items`, `offset`, `limit`, `total_pages`).
    `limit` is capped at 100 on most endpoints; `GET /api/posts` is the known exception
    and currently accepts larger values.

    ## Global limits

    - Request body size: 10 MB (larger requests return 413).
    - CORS origins: `HTTP_ALLOW_ORIGINS` (default `*`).
    - Global rate limit: active when `HTTP_RATE_LIMIT_RPS` > 0.
    - Auth endpoints use a per-IP fixed window. With `REDIS_URL`/`VALKEY_URL` set, counters
      live in Valkey/Redis and apply across instances; otherwise they fall back to
      in-memory counters per instance.

    ## Type conventions

    - **UUID**: string primary key for users, posts, comments, bookmarks and conversations.
    - **Time**: ISO 8601 / RFC3339 (`2026-05-12T08:00:00Z`).
    - **Nullable**: Go pointer fields may be `null` or omitted.
    - **Financial numbers (holdings)**: decimal *strings* in JSON (`"1500000.00"`), not numbers.

    Debug routes (`/api/debug/pprof/*`) are registered only when `APP_DEBUG=true` and are
    not part of this contract.
servers:
- url: http://localhost:{port}
  description: Local development
  variables:
    port: {default: '8080', description: Value of PORT in .env}
- url: https://{host}
  description: Deployment / reverse proxy
  variables:
    host: {default: api.your-domain.tld}
tags:
- {name: Health, description: Liveness and readiness probes.}
- {name: Auth, description: 'Registration, login, OAuth, tokens, password management, activity logs.'}
- {name: Users, description: 'Profiles, admin user management, avatars.'}
- {name: Follow, description: Follow/unfollow and social statistics.}
- {name: Posts, description: 'Post CRUD, feeds, analytics, image upload, sitemap.'}
- {name: Comments, description: Comments on posts.}
- {name: Post views, description: View recording and statistics.}
- {name: Post likes, description: Likes and like statistics.}
- {name: Tags, description: Tag management.}
- {name: Chat, description: 'Chat conversations, messages and SSE streaming.'}
- {name: Holdings, description: Investment portfolio records per user per month/year.}
- {name: Exchange rates, description: Currency exchange rates.}
- {name: Bookmarks, description: Post bookmarks and folders.}
- {name: Notifications, description: In-app notifications.}
- {name: Reports, description: Admin statistics dashboard.}
paths:
  /:
    get:
      tags: [Health]
      summary: Root
      operationId: getRoot
      security: []
      responses:
        '200':
          description: Welcome message in the standard envelope.
          content:
            application/json:
              schema: {$ref: ./schemas/envelope.yaml#/EmptyEnvelope}
              example: {success: true, message: Hello World}
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Pings the database. Does **not** use the standard envelope.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
              example: {status: ok}
        '503':
          description: Database unreachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  reason: {type: string}
              example: {status: unhealthy, reason: database unreachable}
