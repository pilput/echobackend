name: echobackend

# Local development services only — the app itself runs on the host
# (`go run cmd/main.go` or `air`) so hot reload keeps working.
#
#   docker compose up -d --wait   # start everything (waits for healthchecks)
#   docker compose down           # stop
#   docker compose down -v        # stop and DELETE all data
#
# After first start, set in .env:
#   REDIS_URL=redis://localhost:6379
#   S3_USE_SSL=false              # local RustFS speaks plain HTTP

services:
  postgres:
    image: postgres:18-alpine
    container_name: echobackend-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the `custom` schema required by goose (GOOSE_TABLE=custom.goose_migrations).
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: echobackend-valkey
    # Ephemeral cache: no RDB snapshot, no AOF.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: echobackend-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: true
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (http://localhost:9001)
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot job: creates the default bucket after RustFS is healthy.
  createbuckets:
    image: rustfs/rc:latest
    container_name: echobackend-createbuckets
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_BUCKET: ${S3_BUCKET:-minio-bucket}
    entrypoint: >
      /bin/sh -c "
      rc alias set local http://rustfs:9000 $${RUSTFS_ACCESS_KEY} $${RUSTFS_SECRET_KEY} >/dev/null;
      echo 'Creating bucket (if missing):' $${RUSTFS_BUCKET};
      rc mb --ignore-existing local/$${RUSTFS_BUCKET};
      "

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
